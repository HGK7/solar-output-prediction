services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zenith-solar-backend
    ports:
      - "5000:5000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=5000
      - FLASK_DEBUG=false
      - PHYSICS_MODE=${PHYSICS_MODE:-analytical}
      - ENABLE_RAG_GROUNDING=${ENABLE_RAG_GROUNDING:-true}
      - REQUIRE_PRETRAINED_MODELS=true
      - COMPUTE_DEVICE=${COMPUTE_DEVICE:-auto}
      - SYSTEM_KEY_HOURLY_LIMIT=${SYSTEM_KEY_HOURLY_LIMIT:-30}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  backend-gpu:
    profiles: ["gpu"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zenith-solar-backend-gpu
    ports:
      - "5000:5000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=5000
      - FLASK_DEBUG=false
      - PHYSICS_MODE=${PHYSICS_MODE:-analytical}
      - ENABLE_RAG_GROUNDING=${ENABLE_RAG_GROUNDING:-true}
      - REQUIRE_PRETRAINED_MODELS=true
      - COMPUTE_DEVICE=cuda
      - SYSTEM_KEY_HOURLY_LIMIT=${SYSTEM_KEY_HOURLY_LIMIT:-30}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./client/solar-dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    container_name: zenith-solar-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    restart: unless-stopped
