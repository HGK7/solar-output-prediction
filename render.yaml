# Render Blueprint — Infrastructure as Code
# https://docs.render.com/blueprint-spec

services:
  - type: web
    name: solar-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    # Zero-bloat LiteVectorStore SQLite + NumPy index (<5 MB RAM on 512 MB Render free tier)
    # pre-built during image build alongside scikit-learn ensemble models.
    buildCommand: pip install -r requirements.txt -r requirements-rag.txt && python scripts/train_models.py && python -c "from rag.lite_store import get_lite_store; get_lite_store().ensure_synced()"
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FLASK_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: PHYSICS_MODE
        value: analytical
      - key: ENABLE_RAG_GROUNDING
        value: "true"
      - key: REQUIRE_PRETRAINED_MODELS
        value: "true"
      - key: COMPUTE_DEVICE
        value: auto
      - key: SYSTEM_KEY_HOURLY_LIMIT
        value: "30"
